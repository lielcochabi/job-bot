[theme]
base            = "dark"
primaryColor    = "#4f8ef7"
backgroundColor = "#080d18"
secondaryBackgroundColor = "#0c1220"
textColor       = "#c9d8e8"
borderColor     = "#1e2c42"
baseRadius      = "8px"
buttonRadius    = "7px"
showWidgetBorder = true
linkColor       = "#4f8ef7"

[theme.sidebar]
backgroundColor          = "#0a0f1a"
secondaryBackgroundColor = "#0c1220"
textColor                = "#8b98b0"
borderColor              = "#161e2e"

[server]
headless            = true
enableCORS          = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
