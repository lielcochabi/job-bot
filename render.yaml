services:
  - type: web
    name: job-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: NOTIFY_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
